<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Lyra Demo Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="brand-icon"><img src="/brand/ns-logo.svg" alt="NS" /></div>
    <div>
      <h1>Lyra Demo Room</h1>
      <p class="brand-sub">NS Roosterplatform · Ontwikkelkamer voor Lyra</p>
    </div>
  </div>
  <div class="chrome">
    <span class="tag good" id="header-active-version" title="Actieve productie-Lyra-versie">—</span>
    <div id="banner">geen actieve run</div>
    <div class="help-icon" title="Hulp">?</div>
    <div class="user-chip"><div class="user-avatar">👤</div>Demo gebruiker</div>
  </div>
</header>
<nav class="app-nav" id="app-nav">
  <button data-route="dashboard">Dashboard</button>
  <button data-route="test-room">Test Room</button>
  <button data-route="development-runs">Development Runs</button>
  <button data-route="candidates">Candidates</button>
  <button data-route="vergelijken">Vergelijken</button>
  <button data-route="versies">Versies</button>
  <button data-route="logboek">Logboek</button>
</nav>
<main id="app-content"></main>

<div class="modal-backdrop" id="confirm-modal">
  <div class="modal">
    <h2 id="confirm-modal-title">Bevestigen</h2>
    <div id="confirm-modal-body"></div>
    <div class="actions">
      <button class="ghost" id="confirm-modal-cancel">Annuleren</button>
      <button class="primary" id="confirm-modal-ok">Bevestigen</button>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
