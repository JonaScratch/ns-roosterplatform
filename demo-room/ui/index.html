<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Lyra Demo Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  Kritieke inline-opmaak + zelfdiagnose. Staat bewust IN dit bestand: een
  verouderde server die de routes voor /styles.css en /app.js niet kent,
  serveert dit bestand nog wel (van schijf, per verzoek). Zonder dit blok
  viel de pagina dan terug op kale browser-HTML met een reuzenlogo; nu blijft
  hij beheerst en zegt hij precies wat er mis is en hoe je het oplost.
-->
<style>
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  .brand-icon img { width: 34px; height: 34px; }
  #app-nav svg { width: 16px; height: 16px; }
  #asset-fout { display: none; margin: 16px; padding: 14px 18px; border: 2px solid #c0392b; border-radius: 10px; background: #fdecea; color: #6b1d14; font-size: 14px; line-height: 1.5; }
  #asset-fout.zichtbaar { display: block; }
  #asset-fout code { background: #fff; padding: 1px 5px; border-radius: 4px; }
</style>
<script>
  window.__assetFouten = [];
  function __assetFaalt(url) { window.__assetFouten.push(url); }
</script>
<link rel="stylesheet" href="/styles.css" onerror="__assetFaalt('/styles.css')" />
</head>
<body>
<div id="asset-fout" role="alert"></div>
<header class="app-header">
  <div class="brand">
    <div class="brand-icon"><img src="/brand/ns-logo.svg" alt="NS" width="34" height="34" /></div>
    <div>
      <h1>Lyra Demo Room</h1>
      <p class="brand-sub">NS Roosterplatform · Ontwikkelkamer voor Lyra</p>
    </div>
  </div>
  <div class="chrome">
    <span class="tag good" id="header-active-version" title="Actieve productie-Lyra-versie">—</span>
    <div id="banner">geen actieve run</div>
    <div class="help-icon" title="Hulp">?</div>
    <div class="user-chip"><div class="user-avatar">👤</div>Demo gebruiker</div>
  </div>
</header>
<nav class="app-nav" id="app-nav">
  <button data-route="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg>Dashboard</button>
  <button data-route="test-room"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>Test Room</button>
  <button data-route="development-runs"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>Development Runs</button>
  <button data-route="candidates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Candidates</button>
  <button data-route="vergelijken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h11a5 5 0 0 1 5 5v0"/><path d="M16 21l4-4-4-4"/><path d="M20 17H9a5 5 0 0 1-5-5v0"/></svg>Vergelijken</button>
  <button data-route="versies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 8 12 14 22 8 12 2"/><polyline points="2 14 12 20 22 14"/><polyline points="2 11 12 17 22 11"/></svg>Versies</button>
  <button data-route="logboek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>Logboek</button>
</nav>
<main id="app-content"></main>

<div class="modal-backdrop" id="confirm-modal">
  <div class="modal">
    <h2 id="confirm-modal-title">Bevestigen</h2>
    <div id="confirm-modal-body"></div>
    <div class="actions">
      <button class="ghost" id="confirm-modal-cancel">Annuleren</button>
      <button class="primary" id="confirm-modal-ok">Bevestigen</button>
    </div>
  </div>
</div>

<script type="module" src="/app.js" onerror="__assetFaalt('/app.js')"></script>
<script>
  // Controle ná het laden, niet alleen via onerror: een stylesheet die met een
  // verkeerde Content-Type wordt geserveerd, geeft geen onerror maar wordt
  // door de browser wél genegeerd. styles.css zet daarom een eigen markering
  // (--demo-room-css) die hier wordt uitgelezen.
  window.addEventListener("load", function () {
    var cssActief = getComputedStyle(document.documentElement).getPropertyValue("--demo-room-css").trim() === "1";
    if (!cssActief && window.__assetFouten.indexOf("/styles.css") < 0) window.__assetFouten.push("/styles.css");
    if (!window.__demoRoomAppGeladen && window.__assetFouten.indexOf("/app.js") < 0) window.__assetFouten.push("/app.js");
    if (window.__assetFouten.length === 0) return;
    var vak = document.getElementById("asset-fout");
    vak.className = "zichtbaar";
    vak.innerHTML =
      "<strong>De Demo Room kon zijn opmaak/code niet laden</strong> (" + window.__assetFouten.join(", ") + " niet beschikbaar).<br>" +
      "Meestal draait er op deze poort nog een <em>oudere</em> Demo Room-server die de nieuwe bestanden niet kent. " +
      "Sluit alle oude &lsquo;Lyra Demo Room&rsquo;-vensters en start <code>Start Demo Room.bat</code> opnieuw. " +
      "Lukt dat niet: <code>netstat -ano | findstr :4173</code> en daarna <code>taskkill /PID &lt;pid&gt; /F</code>.";
    fetch("/api/server-info").then(function (r) { return r.ok ? r.json() : null; }).then(function (info) {
      var extra = document.createElement("div");
      extra.style.marginTop = "6px";
      extra.textContent = info
        ? "Draaiende server: build " + info.build + ", PID " + info.pid + ", gestart " + info.startedAt + (info.uiAssetsMissing && info.uiAssetsMissing.length ? " — ontbrekende UI-bestanden: " + info.uiAssetsMissing.join(", ") : "")
        : "De draaiende server kent /api/server-info niet — dat bevestigt dat hij ouder is dan deze pagina.";
      vak.appendChild(extra);
    }).catch(function () {});
  });
</script>
</body>
</html>
